#script:
#  the fairy tale is a folk tale, text taken and slightly modified from the website of the Pysel primary school and kindergarten near Trebic
#
#graphics:
#  pictures by BaraK
#
#sound:
#  texts were voiced by machine using the free version of MS Speech Studio from Azure (voices Antonin and Vlasta)
#  sound effects downloaded from freesound.org
#  edited and cut in Audacity


#header starts here (do not touch the ---, it separates sections!)
---

#book number, its OID code must be printed on the 'power on' button
book_id: 0x0803

#these OIDs are built-in and are not needed for generating the BNL file
#they are here only for generating OIDs for printing (the generator adds them to generate_oids.yaml)
sys_icons:
  - volume_up
  - volume_down
  - stop

#book encryption (this should leave almost everything unencrypted)
encryption:
  header_key: 0x00000100
  prekey:
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
    - 0x00
  prekey_dw: 0x000000F5

#buttons for switching between modes
#mode 0 and 1 are the same, the pen switches between them when the same code is tapped twice
book_mode_read:
  mode_0:
    - mod_zakladni.mp3
  mode_2:
    - mod_vice_inf.mp3

#sound played on the first press of the Start button - the same should be on oid_x0000
start_button_1st_read:
  mode_0:
    - kniha_vitej1.mp3
  mode_1:
    - kniha_vitej1.mp3
  mode_2:
    - kniha_vitej1.mp3

#sound played on the second press of the Start button
start_button_2nd_read:
  mode_0:
    - kniha_vitej2.mp3
  mode_1:
    - kniha_vitej2.mp3
  mode_2:
    - kniha_vitej2.mp3

#unknown/undocumented tables
#better not touch them, at most replace the sound files
#audibly they only play the 'jingle' and the negative and positive sounds, 
#but it is not clear why it is repeated so many times and when a given sound is triggered
unk_tbl_ptr_16:
  - oid_x01A6_chime
  - oid_x01A7_chime
  - oid_x01A8_chime
unk_tbl_ptr_27:
  - oid_x01A9_buzz
  - oid_x01AA_buzz
  - oid_x01AB_buzz
  - oid_x01AC_buzz
  - oid_x01AD_buzz
unk_tbl_ptr_28:
  - oid_x01AE_ting
  - oid_x01AF_ting
  - oid_x01B0_ting
unk_tbl_ptr_29:
  - oid_x01B5_buzz
  - oid_x01B6_buzz
  - oid_x01B7_buzz


#quiz information starts here
---
#reaction to a wrong answer
#why it is split into two arrays and how long the arrays are has not been explained yet
quiz_neg1:
  - oid_x019B_buzz
  - oid_x019C_buzz
  - oid_x019D_buzz
quiz_neg2:
  - oid_x019E_buzz_znovu
  - oid_x019F_buzz_jednou
  - oid_x01A0_buzz
  - oid_x01A1_buzz_znovu
  - oid_x01A2_buzz_jednou
  - oid_x01A3_buzz

#reaction to a correct answer
#why it is split into two arrays and how long the arrays are has not been explained yet
quiz_pos1:
  - oid_x0190_ting
  - oid_x0191_ting
quiz_pos2:
  - oid_x0193_ting_vyborne
  - oid_x0194_ting_velmidobre
  - oid_x0195_ting
  - oid_x0196_ting_vyborne   
  - oid_x0197_ting_velmidobre
  - oid_x0198_ting
  - oid_x0199_ting_vyborne   
  - oid_x019A_ting_velmidobre

#quiz evaluation. Always has N+1 values for N questions
#it is 0,1,2,3,4 correct answers and then all correct
quiz_results:
  - oid_x01B8_kviz_vysledek_0
  - oid_x01B9_kviz_vysledek_1
  - oid_x01BA_kviz_vysledek_2
  - oid_x01BB_kviz_vysledek_3
  - oid_x01BC_kviz_vysledek_4
  - oid_x01BD_kviz_vysledek_5

#the actual quiz pages start here
quizes:
    #how many questions will be asked in the quiz
  - q_asked: 0x0005
    #the first quiz is always oid 100! The sound can be any oid, but the same one is used
    q_oid: oid_100_kviz1
    #quiz type, known types are 0 and 4, see documentation
    q_type: 0x0000
    #poorly documented, see documentation
    q_unk: 0x0000
    #the individual questions are here
    questions:
        #these are the oids of the correct answers
      - q0_good_reply_oids:
          - oid_11001_slepicka
          - oid_11007_slepicka
          - oid_11011_slepicka
          - oid_11014_slepicka
          - oid_11018_slepicka
          - oid_11023_slepicka
          - oid_11026_slepicka
          - oid_11030_slepicka
          - oid_11034_slepicka
        #this is the oid for the question sound
        q0_oid: oid_13000_kdo_se_rozdeli
        #unknown
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11002_kohoutek
          - oid_11006_kohoutek_lakomec
          - oid_11010_kohoutek
        q0_oid: oid_13001_kdo_je_lakomec
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11033_louka
          - oid_11001_slepicka
          - oid_11007_slepicka
          - oid_11011_slepicka
          - oid_11014_slepicka
          - oid_11018_slepicka
          - oid_11023_slepicka
          - oid_11026_slepicka
          - oid_11030_slepicka
          - oid_11034_slepicka
        q0_oid: oid_13002_kdo_chce_vodu
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11015_studna
        q0_oid: oid_13003_kdo_chce_satek
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11019_svadlenka
        q0_oid: oid_13004_kdo_dal_satek
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11019_svadlenka
        q0_oid: oid_13005_kdo_chce_botu
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11022_svec
        q0_oid: oid_13006_kdo_dal_botu
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11022_svec
        q0_oid: oid_13007_kdo_chce_jelito
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11027_prasatko
        q0_oid: oid_13008_kdo_dal_jelito
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11027_prasatko
        q0_oid: oid_13009_kdo_chce_mleko
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11031_kravicka
        q0_oid: oid_13010_kdo_dal_mleko
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11031_kravicka
        q0_oid: oid_13011_kdo_chce_travicku
        q0_unk: 0

      - q0_good_reply_oids:
          - oid_11033_louka
        q0_oid: oid_13012_kdo_dal_travicku
        q0_unk: 0



[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "albik"
version = "0.1.0"
description = "Generates Albi pen books from Inkscape drawings"
license = { text = "MPL-2.0" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["albik"]

[tool.setuptools.package-data]
albik = ["data/*.bin"]
